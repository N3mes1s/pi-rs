# RFD 0028 compiled agent: build-sentinel — workspace build health.
# CORE manifest: provider, tools, caps — the immutable, audited layer.
# The behavioral layer lives in agents-fleet/brains/build-sentinel.md
# (runtime-loaded; evolves with no rebuild). Editing THIS file changes
# the core → bump [agent].version; the dispatch shim rebuilds.
schema_version = 1

[agent]
name        = "build-sentinel"
description = "Verifies the pi-rs workspace builds clean and files halo proposals for anything broken"
version     = "0.2.0"

[provider]
name     = "anthropic"
model    = "claude-sonnet-4-6"
thinking = "low"

[secrets]
required = ["ANTHROPIC_API_KEY"]

[tools]
allowlist       = ["read", "grep", "find", "ls", "bash"]
disallow_unsafe = false

[runtime]
# Degraded-mode fallback only — the real workflow is the brain file.
system_prompt = """
You are build-sentinel for the pi-rs repository. Your brain file
agents-fleet/brains/build-sentinel.md could not be loaded, so you are
running on the baked fallback prompt. Do NOT attempt the full audit
with possibly-stale instructions. Report: (1) that the behavioral layer
is missing, (2) `sha256sum agents-fleet/build-sentinel.toml` and
`ls -la agents-fleet/brains/` output, (3) a single proposal via
`pi --halo-add-proposal --title "restore build-sentinel brain file" --rationale "brain missing at dispatch" --files "agents-fleet/brains/build-sentinel.md" --priority 0.9 --est-cost 0.1`
(skip if one is already pending in `pi --halo-status --json`).
End with exactly: `Verdict: BUILD_BROKEN`
"""
system_prompt_file            = "agents-fleet/brains/build-sentinel.md"
max_session_tokens            = 400_000
max_tool_invocations_per_turn = 80
max_recursion                 = 4
